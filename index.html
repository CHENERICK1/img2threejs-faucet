<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pull-Out Kitchen Faucet - img2threejs Blockout</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1d21;color:#d4d8de;font-family:'Segoe UI',system-ui,sans-serif}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:13px;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;opacity:.7;z-index:10}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;opacity:.6;z-index:20}
#header{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.5;z-index:10;pointer-events:none;letter-spacing:1px;text-shadow:0 1px 4px #000}
#stats{position:fixed;top:16px;right:16px;font-size:11px;opacity:.4;z-index:10;pointer-events:none;text-align:right;line-height:1.6}
</style>
</head>
<body>
<div id="loading">Loading faucet scene...</div>
<div id="header">PULL-OUT KITCHEN FAUCET · BLOCKOUT</div>
<div id="stats"><span id="stat-line"></span></div>
<div id="info">🖱 Drag to orbit · Scroll to zoom · 🅢 Space to toggle auto-rotate</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ── Scene Setup ──
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1d21');

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 10);
camera.position.set(0.25, 0.18, 0.32);
camera.lookAt(0, 0.10, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ── Controls ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.10, 0.02);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.12;
controls.maxDistance = 0.8;
controls.maxPolarAngle = Math.PI * 0.75;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.update();

// ── Lighting ──
scene.add(new THREE.AmbientLight('#404550', 1.5));
const key = new THREE.DirectionalLight('#ffffff', 3.5);
key.position.set(0.4, 0.35, 0.3);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near = 0.01;
key.shadow.camera.far = 2;
key.shadow.camera.left = -0.4; key.shadow.camera.right = 0.4;
key.shadow.camera.top = 0.4; key.shadow.camera.bottom = -0.4;
key.shadow.bias = -0.0001;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight('#a0b8d0', 1.2);
fill.position.set(-0.3, 0.15, -0.2);
scene.add(fill);

const rim = new THREE.DirectionalLight('#8090a0', 2.0);
rim.position.set(0, 0.05, -0.3);
scene.add(rim);

const topLight = new THREE.DirectionalLight('#ffffff', 1.0);
topLight.position.set(0, 0.35, 0.1);
scene.add(topLight);

// ── Materials ──
const matBrushed = new THREE.MeshStandardMaterial({
  color: '#C0C4C8', roughness: 0.5, metalness: 0.9
});
const matDarkGray = new THREE.MeshStandardMaterial({
  color: '#4A4E53', roughness: 0.6, metalness: 0.85
});
const matBlack = new THREE.MeshStandardMaterial({
  color: '#2A2A2A', roughness: 0.7, metalness: 0.8
});
const matPlasticBlack = new THREE.MeshStandardMaterial({
  color: '#1A1A1A', roughness: 0.8, metalness: 0.1
});
const matBlue = new THREE.MeshStandardMaterial({
  color: '#2196F3', roughness: 0.3, metalness: 0.1, emissive: '#0D47A1', emissiveIntensity: 0.5
});
const matGround = new THREE.MeshStandardMaterial({
  color: '#2a2d32', roughness: 0.9, metalness: 0.05
});

// ── Build Faucet ──
const faucet = new THREE.Group();

// Base - two-tier cylinder
const baseLower = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.015, 32), matBrushed);
baseLower.position.y = 0.0075;
baseLower.castShadow = true; baseLower.receiveShadow = true;
faucet.add(baseLower);

const baseFlange = new THREE.Mesh(new THREE.TorusGeometry(0.027, 0.0025, 16, 32), matBrushed);
baseFlange.rotation.x = Math.PI/2;
baseFlange.position.y = 0.015;
baseFlange.castShadow = true;
faucet.add(baseFlange);

const baseUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.008, 32), matBrushed);
baseUpper.position.y = 0.019;
baseUpper.castShadow = true; baseUpper.receiveShadow = true;
faucet.add(baseUpper);

// Body column
const bodyCol = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.08, 32), matBrushed);
bodyCol.position.y = 0.055;
bodyCol.castShadow = true; bodyCol.receiveShadow = true;
faucet.add(bodyCol);

// Body decoration ring
const bodyRing = new THREE.Mesh(new THREE.TorusGeometry(0.017, 0.002, 16, 32), matBrushed);
bodyRing.rotation.x = Math.PI/2;
bodyRing.position.y = 0.072;
faucet.add(bodyRing);

// ── Handle (right side) ──
const handleGroup = new THREE.Group();
const handleStem = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.025, 24), matDarkGray);
handleStem.rotation.z = Math.PI/2;
handleStem.position.set(0.0225, 0, 0);
handleStem.castShadow = true;
handleGroup.add(handleStem);

const handleKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.038, 24), matDarkGray);
handleKnob.position.set(0.038, -0.003, 0);
handleKnob.castShadow = true; handleKnob.receiveShadow = true;
handleGroup.add(handleKnob);

// Handle grip texture bands
for (let i=0; i<4; i++) {
  const gripBand = new THREE.Mesh(new THREE.TorusGeometry(0.0138, 0.0012, 8, 24), matPlasticBlack);
  gripBand.position.set(0.038, -0.012 + i*0.007, 0);
  handleGroup.add(gripBand);
}

// Blue indicator dot
const indicator = new THREE.Mesh(new THREE.SphereGeometry(0.003, 16, 16), matBlue);
indicator.position.set(0.038, 0.012, 0.012);
handleGroup.add(indicator);

handleGroup.position.y = 0.085;
faucet.add(handleGroup);

// ── Gooseneck Arch ──
const arch = new THREE.Group();
const arcRadius = 0.04;
const tubeRadius = 0.012;
const arcAngle = Math.PI * 0.72;
const arcSegments = 32;

// Build arch from torus segment approximation
for (let i=0; i<arcSegments; i++) {
  const a0 = -Math.PI/2 + (i/arcSegments)*arcAngle;
  const a1 = -Math.PI/2 + ((i+1)/arcSegments)*arcAngle;
  const midAngle = (a0 + a1)/2;
  const segLength = arcRadius * (arcAngle/arcSegments);
  
  const cx = arcRadius * Math.cos(midAngle);
  const cy = arcRadius * Math.sin(midAngle);
  
  const seg = new THREE.Mesh(new THREE.CylinderGeometry(tubeRadius, tubeRadius, segLength, 16), matBrushed);
  seg.position.set(cx, cy, 0);
  seg.rotation.z = midAngle + Math.PI/2;
  seg.castShadow = true;
  arch.add(seg);
}

arch.position.set(0, 0.095, 0.025);
faucet.add(arch);

// ── Spout (pull-out spray head) ──
const spoutGroup = new THREE.Group();

const spoutBody = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.012, 0.045, 24), matDarkGray);
spoutBody.position.y = -0.022;
spoutBody.castShadow = true;
spoutGroup.add(spoutBody);

// Spray rings
for (let i=0; i<3; i++) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.0148, 0.002, 16, 24), matPlasticBlack);
  ring.position.y = -0.035 + i*0.01;
  spoutGroup.add(ring);
}

// Spray face plate
const sprayFace = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.004, 24), matBlack);
sprayFace.position.y = -0.045;
sprayGroup.add(sprayFace);

// Nozzle holes (small dots on face)
for (let r=1; r<=2; r++) {
  const ringRadius = 0.004 * r;
  const count = r*8;
  for (let j=0; j<count; j++) {
    const angle = (j/count)*Math.PI*2;
    const hole = new THREE.Mesh(new THREE.SphereGeometry(0.0012, 8, 8), matPlasticBlack);
    hole.position.set(Math.cos(angle)*ringRadius, -0.046, Math.sin(angle)*ringRadius);
    spoutGroup.add(hole);
  }
}

// Black seal ring at top of spout
const sealRing = new THREE.Mesh(new THREE.TorusGeometry(0.0145, 0.0025, 16, 24), matBlack);
sealRing.position.y = 0.001;
spoutGroup.add(sealRing);

spoutGroup.position.set(0, 0.035, 0.055);
spoutGroup.rotation.x = -0.25;
faucet.add(spoutGroup);

// ── Pull-out hose (visible segment inside arch) ──
const hose = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.04, 16), matDarkGray);
hose.position.set(0, 0.06, 0.04);
hose.rotation.x = -0.15;
hose.castShadow = true;
faucet.add(hose);

scene.add(faucet);

// Rotate whole faucet to face camera nicely
faucet.rotation.y = -0.3;

// ── Ground ──
const ground = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), matGround);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.005;
ground.receiveShadow = true;
scene.add(ground);

// ── Grid helper (subtle) ──
const grid = new THREE.PolarGridHelper(0.15, 32, 16, 64, '#444850', '#333840');
grid.position.y = -0.002;
scene.add(grid);

// ── Animation ──
document.getElementById('loading').style.display = 'none';

let autoRotate = true;
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    autoRotate = !autoRotate;
    controls.autoRotate = autoRotate;
  }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  document.getElementById('stat-line').textContent =
    `🧩 ${faucet.children.length + handleGroup.children.length + spoutGroup.children.length + arch.children.length} meshes · Faucet Blockout`;
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
